name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer Xvfb (Linux, pas d'écran par défaut)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Lancer les tests (Linux, sous écran virtuel)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests

      - name: Lancer les tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests
