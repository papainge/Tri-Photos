name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer ruff
        run: pip install ruff

      - name: Lancer ruff check
        run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # 3.9 est le minimum annoncé par le README ; 3.12 une version récente
        # représentative. Sans cette matrice, rien ne détecterait une régression de
        # compatibilité avec le minimum promis (ex. une syntaxe/API trop récente).
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer pillow-heif (dépendance optionnelle, testée aussi en CI)
        run: pip install -r requirements-heif.txt

      - name: Installer Xvfb (Linux, pas d'écran par défaut)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Lancer les tests (Linux, sous écran virtuel)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests

      - name: Lancer les tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests
